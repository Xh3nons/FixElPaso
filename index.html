<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>if(window.location.pathname.endsWith("index.html")||window.location.pathname.endsWith("/")){if(!sessionStorage.getItem("visited")){sessionStorage.setItem("visited","1");window.location.replace("about.html");}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fix El Paso — Community Infrastructure Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080a0c;
  --bg2: #0d1014;
  --bg3: #121518;
  --border: rgba(255,255,255,0.06);
  --border-hi: rgba(255,255,255,0.12);
  --text: #e2e4e6;
  --muted: #4a5260;
  --muted2: #7a8592;
  --orange: #FF6B00;
  --orange2: #cc5500;
  --orange-glow: rgba(255,107,0,0.1);
  --pothole: #E74C3C;
  --light: #F39C12;
  --flood: #2980B9;
  --sidewalk: #8E44AD;
  --signage: #27AE60;
  --other: #556070;
  --syne: 'Syne', sans-serif;
  --mono: 'Syne Mono', monospace;
}

html, body { height: 100%; font-family: var(--syne); color: var(--text); background: var(--bg); }

/* NOISE */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(8,10,12,0.95); backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 52px;
  border-bottom: 1px solid var(--border);
}
.nav-brand {
  font-family: var(--mono); font-size: 12px; font-weight: 400;
  color: var(--text); text-decoration: none; letter-spacing: 0.06em;
  display: flex; align-items: center; gap: 10px;
}
.nav-brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
.nav-brand span { color: var(--orange); }
.nav-links { display: flex; align-items: center; gap: 2px; list-style: none; }
.nav-links a {
  display: block; padding: 5px 12px; font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted2); text-decoration: none; transition: color 0.15s;
  border: 1px solid transparent; border-radius: 4px;
}
.nav-links a:hover { color: var(--text); border-color: var(--border); }
.nav-links a.active { color: var(--orange); }
.nav-links a.nav-cta {
  background: var(--orange); color: #000; font-weight: 700;
  margin-left: 8px; border-color: var(--orange);
}
.nav-links a.nav-cta:hover { background: #ff8533; border-color: #ff8533; color: #000; }
.nav-hamburger { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px; }
.nav-hamburger span { display: block; width: 20px; height: 1.5px; background: var(--text); }
.nav-drawer {
  display: none; position: fixed; top: 52px; left: 0; right: 0;
  background: var(--bg2); z-index: 999;
  padding: 12px 16px 16px; border-top: 1px solid var(--border);
  flex-direction: column; gap: 4px;
}
.nav-drawer.open { display: flex; }
.nav-drawer a {
  display: block; padding: 10px 14px; font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted2); text-decoration: none; transition: color 0.15s;
}
.nav-drawer a:hover, .nav-drawer a.active { color: var(--orange); }
.nav-drawer a.nav-cta { background: var(--orange); color: #000; font-weight: 700; margin-top: 6px; border-radius: 4px; }

/* MAP */
#map { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; }
#map-loading {
  position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
  background: var(--bg); z-index: 500;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
}
.loading-spinner { width: 32px; height: 32px; border: 2px solid var(--border-hi); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }

/* LEGEND */
.legend {
  position: absolute; bottom: 24px; left: 12px; z-index: 900;
  background: rgba(8,10,12,0.92); backdrop-filter: blur(8px);
  border: 1px solid var(--border-hi);
  padding: 14px 16px; min-width: 160px;
}
.legend-title {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
}
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-family: var(--mono); font-size: 11px; color: var(--muted2); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* HEATMAP BTN */
#heatBtn {
  position: absolute; bottom: 24px; right: 12px; z-index: 900;
  background: rgba(8,10,12,0.92); backdrop-filter: blur(8px);
  color: var(--muted2); border: 1px solid var(--border-hi);
  padding: 9px 16px; font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  transition: all 0.2s;
}
#heatBtn:hover { border-color: var(--orange); color: var(--orange); }
#heatBtn.active { background: var(--orange); color: #000; border-color: var(--orange); font-weight: 700; }

/* STATS BAR */
.stats-bar {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  z-index: 900; display: flex; gap: 6px; flex-wrap: wrap;
  justify-content: center; max-width: calc(100vw - 40px);
}
.stat-pill {
  background: rgba(8,10,12,0.92); backdrop-filter: blur(8px);
  border: 1px solid var(--border-hi);
  padding: 5px 12px; font-family: var(--mono); font-size: 11px;
  display: flex; align-items: center; gap: 7px; white-space: nowrap;
  color: var(--muted2);
}
.stat-dot { width: 7px; height: 7px; border-radius: 50%; }
.stat-count { font-weight: 700; color: var(--orange); }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; overflow-y: auto; padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border-hi);
  padding: 28px; width: 100%; max-width: 460px; margin: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6);
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
.modal-title { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--orange); }
.modal-close { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.2rem; line-height: 1; transition: color 0.15s; }
.modal-close:hover { color: var(--text); }
.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 8px;
}
.form-label .optional { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); margin-left: 4px; opacity: 0.6; }
textarea, input[type="text"] {
  width: 100%; background: var(--bg3); border: 1px solid var(--border-hi);
  padding: 10px 12px; font-family: var(--syne); font-size: 0.85rem;
  color: var(--text); transition: border-color 0.15s; outline: none;
}
textarea:focus, input:focus { border-color: var(--orange); }
textarea { resize: vertical; min-height: 80px; }
.category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cat-btn {
  border: 1px solid var(--border-hi); padding: 10px;
  background: var(--bg3); cursor: pointer; font-family: var(--mono);
  font-size: 10px; letter-spacing: 0.06em; color: var(--muted2);
  display: flex; align-items: center; gap: 8px;
  transition: border-color 0.15s, background 0.15s; text-transform: uppercase;
}
.cat-btn:hover { border-color: var(--orange); color: var(--text); }
.cat-btn.selected { border-color: var(--orange); color: var(--orange); background: var(--orange-glow); font-weight: 700; }
.cat-color { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cat-btn[data-cat="pothole"] .cat-color { background: var(--pothole); }
.cat-btn[data-cat="light"] .cat-color { background: var(--light); }
.cat-btn[data-cat="flood"] .cat-color { background: var(--flood); }
.cat-btn[data-cat="sidewalk"] .cat-color { background: var(--sidewalk); }
.cat-btn[data-cat="signage"] .cat-color { background: var(--signage); }
.cat-btn[data-cat="other"] .cat-color { background: var(--other); }
.photo-drop {
  border: 1px dashed var(--border-hi); padding: 18px; text-align: center;
  cursor: pointer; transition: border-color 0.15s, background 0.15s; background: var(--bg3);
}
.photo-drop:hover, .photo-drop.dragover { border-color: var(--orange); background: var(--orange-glow); }
.photo-drop.has-file { border-color: var(--signage); border-style: solid; }
.photo-drop-icon { font-size: 1.2rem; color: var(--muted); margin-bottom: 6px; }
.photo-drop-text { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.photo-preview-img { width: 100%; max-height: 120px; object-fit: cover; margin-top: 10px; display: none; }
.photo-hint { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 6px; }
.loc-row { display: flex; gap: 8px; align-items: flex-start; }
.btn-loc {
  flex-shrink: 0; background: var(--bg3); border: 1px solid var(--border-hi);
  padding: 10px 14px; font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; color: var(--muted2);
  transition: border-color 0.15s, color 0.15s; white-space: nowrap;
}
.btn-loc:hover { border-color: var(--orange); color: var(--orange); }
.location-status { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.location-status.ok { color: var(--signage); }
.location-status.err { color: var(--pothole); }
.btn-submit {
  width: 100%; background: var(--orange); color: #000;
  border: none; padding: 13px; font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  font-weight: 700; cursor: pointer; transition: background 0.15s; margin-top: 6px;
}
.btn-submit:hover { background: #ff8533; }
.btn-submit:disabled { background: var(--bg3); color: var(--muted); cursor: not-allowed; border: 1px solid var(--border); }

/* TOAST */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 3000; background: var(--bg2); color: var(--text);
  padding: 10px 20px; font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.08em; opacity: 0; transition: opacity 0.3s;
  pointer-events: none; border-left: 2px solid var(--orange);
  border: 1px solid var(--border-hi); border-left: 2px solid var(--orange);
  white-space: nowrap;
}
#toast.show { opacity: 1; }

/* LEAFLET OVERRIDES */
.leaflet-tile-pane { filter: brightness(0.7) saturate(0.5); }
.leaflet-control-zoom a { background: var(--bg2) !important; color: var(--text) !important; border-color: var(--border-hi) !important; }
.leaflet-popup-content-wrapper { background: var(--bg2); border: 1px solid var(--border-hi); border-radius: 0; box-shadow: 0 8px 32px rgba(0,0,0,0.5); color: var(--text); }
.leaflet-popup-tip { background: var(--bg2); }

@media (max-width: 640px) {
  .nav-links { display: none; }
  .nav-hamburger { display: flex; }
  .stats-bar { display: none; }
  nav { padding: 0 1rem; }
}
@media (min-width: 641px) { .nav-drawer { display: none !important; } }
</style>
</head>

<nav>
  <a href="about.html" class="nav-brand">
    <span class="nav-brand-dot"></span>
    Fix<span> El Paso</span>
  </a>
  <ul class="nav-links">

<div class="nav-drawer" id="navDrawer">
  <a href="about.html">About</a>
  <a href="index.html" class="active">Map</a>
  <a href="about.html#contact">Contact</a>
  <a href="index.html" class="nav-cta" onclick="closeDrawer();openModal();return false;">+ Report Issue</a>
</div>

<div id="map-loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading reports</div>
</div>

<div id="map">
  <div class="stats-bar" id="statsBar"></div>
  <div class="legend">
    <div class="legend-title">Issue type</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--pothole)"></div>Pothole</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--light)"></div>Streetlight</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--flood)"></div>Flooding</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--sidewalk)"></div>Sidewalk</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--signage)"></div>Signage</div>

      <label class="form-label">Category</label>
      <div class="category-grid">
        <button class="cat-btn" data-cat="pothole" onclick="selectCat(this)"><span class="cat-color"></span>Pothole</button>
        <button class="cat-btn" data-cat="light" onclick="selectCat(this)"><span class="cat-color"></span>Streetlight</button>
        <button class="cat-btn" data-cat="flood" onclick="selectCat(this)"><span class="cat-color"></span>Flooding</button>
        <button class="cat-btn" data-cat="sidewalk" onclick="selectCat(this)"><span class="cat-color"></span>Sidewalk</button>
        <button class="cat-btn" data-cat="signage" onclick="selectCat(this)"><span class="cat-color"></span>Signage</button>
        <button class="cat-btn" data-cat="other" onclick="selectCat(this)"><span class="cat-color"></span>Other</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Description <span class="optional">(optional)</span></label>
      <textarea id="descInput" placeholder="Size, severity, how long it's been there..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Photo <span class="optional">(optional)</span></label>
      <div class="photo-drop" id="photoDrop"
        onclick="document.getElementById('photoInput').click()"

        <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoSelect(this)" />

      </div>
      <div class="photo-hint" id="photoStatus"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Location <span style="color:var(--orange);font-size:9px;letter-spacing:0.1em">(required)</span></label>
      <div style="margin-bottom:8px">
        <button class="btn-loc" style="width:100%;margin-bottom:8px" onclick="getLocation()">Use My GPS Location</button>
        <div style="font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;text-align:center">— or enter intersection —</div>

            <div id="autocomplete-list-1" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:9999;background:#0d1014;border:1px solid rgba(255,255,255,0.1);border-top:none;max-height:160px;overflow-y:auto;"></div>
          </div>
          <span style="font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center">&amp;</span>
          <div style="position:relative">
            <input type="text" id="street2Input" placeholder="Street 2" oninput="onStreetInput(2)" autocomplete="off" />
            <div id="autocomplete-list-2" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:9999;background:#0d1014;border:1px solid rgba(255,255,255,0.1);border-top:none;max-height:160px;overflow-y:auto;"></div>
          </div>

    <button class="btn-submit" id="submitBtn" onclick="submitReport()" disabled>Submit Report</button>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script>
const CATS = {
  pothole:  { label:'Pothole',            color:'#E74C3C' },
  light:    { label:'Broken Streetlight', color:'#F39C12' },
  flood:    { label:'Flooding/Drainage',  color:'#2980B9' },
  sidewalk: { label:'Damaged Sidewalk',   color:'#8E44AD' },
  signage:  { label:'Missing Signage',    color:'#27AE60' },
  other:    { label:'Other',              color:'#556070' },
};

const map = L.map('map', {zoomControl:true}).setView([31.7619,-106.4850], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom:19
}).addTo(map);

function makeIcon(color) {
  return L.divIcon({
    className:'',
    html:`<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 24 32">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 20 12 20S24 21 24 12C24 5.37 18.63 0 12 0z" fill="${color}" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="4.5" fill="rgba(0,0,0,0.3)"/></svg>`,
    iconSize:[22,30], iconAnchor:[11,30], popupAnchor:[0,-32]
  });
}

let allMarkers=[], heatLayer=null, heatActive=false;

function addReport(r) {
  const cat = CATS[r.cat] || CATS.other;
  const imgHtml = r.photoUrl
    ? `<a href="${escHtml(r.photoUrl)}" target="_blank" rel="noopener noreferrer"><img src="${escHtml(r.photoUrl)}" style="width:100%;max-height:110px;object-fit:cover;margin-top:8px;"/></a>` : '';
  const marker = L.marker([r.lat,r.lng], {icon:makeIcon(cat.color)}).bindPopup(`
    <div style="font-family:'Syne Mono',monospace">
      <div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#FF6B00;margin-bottom:6px">${cat.label}</div>
      <div style="font-size:12px;color:#e2e4e6;line-height:1.5">${escHtml(r.desc)}</div>
      ${r.address?`<div style="font-size:10px;color:#4a5260;margin-top:5px">${escHtml(r.address)}</div>`:''}
      ${imgHtml}
    </div>`);
  marker.addTo(map);
  allMarkers.push({marker, cat:r.cat, lat:r.lat, lng:r.lng, id:r.id});
}

function buildHeatLayer() {
  if (heatLayer) map.removeLayer(heatLayer);
  heatLayer = L.heatLayer(allMarkers.map(m=>[m.lat,m.lng,0.6]), {
    radius:35, blur:25, maxZoom:14,
    gradient:{0.3:'#2980B9',0.6:'#F39C12',1.0:'#E74C3C'}
  });
}

function toggleHeat() {
  heatActive = !heatActive;
  const btn = document.getElementById('heatBtn');
  if (heatActive) {
    allMarkers.forEach(m=>map.removeLayer(m.marker));
    buildHeatLayer(); heatLayer.addTo(map);
    btn.classList.add('active'); btn.textContent='Show Pins';
  } else {
    if (heatLayer) map.removeLayer(heatLayer);
    allMarkers.forEach(m=>m.marker.addTo(map));
    btn.classList.remove('active'); btn.textContent='Heatmap';
  }
}

function updateStats() {
  const counts={};
  allMarkers.forEach(m=>counts[m.cat]=(counts[m.cat]||0)+1);
  document.getElementById('statsBar').innerHTML=Object.entries(counts).map(([cat,n])=>
    `<div class="stat-pill"><div class="stat-dot" style="background:${CATS[cat].color}"></div><span class="stat-count">${n}</span>${CATS[cat].label}</div>`
  ).join('');
}

function toggleDrawer(){ document.getElementById('navDrawer').classList.toggle('open'); }
function closeDrawer(){ document.getElementById('navDrawer').classList.remove('open'); }

let selectedCat=null, userLat=null, userLng=null, selectedPhotoFile=null;
let locationConfirmed = false;
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function openModal(){ document.getElementById('reportModal').classList.add('open'); }
function closeModal(){ document.getElementById('reportModal').classList.remove('open'); resetForm(); }
document.getElementById('reportModal').addEventListener('click',function(e){if(e.target===this)closeModal();});

function selectCat(btn){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected'); selectedCat=btn.dataset.cat; checkReady();
}

function handlePhotoSelect(input){
  const file=input.files[0]; if(!file) return;
  if(file.size>10*1024*1024) document.getElementById('photoStatus').textContent='Large file — upload may take a moment.';
  selectedPhotoFile=file;
  const preview=document.getElementById('photoPreview');
  preview.src=URL.createObjectURL(file); preview.style.display='block';
  document.getElementById('photoDrop').classList.add('has-file');
  document.getElementById('photoDropText').textContent=file.name;
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('photoDrop').classList.remove('dragover');
  const file=e.dataTransfer.files[0];
  if(file&&file.type.startsWith('image/')){
    selectedPhotoFile=file;
    const preview=document.getElementById('photoPreview');
    preview.src=URL.createObjectURL(file); preview.style.display='block';
    document.getElementById('photoDrop').classList.add('has-file');
    document.getElementById('photoDropText').textContent=file.name;
  }
}

function getLocation(){
  const status=document.getElementById('locStatus');
  status.className='location-status'; status.textContent='Getting location...';
  if(!navigator.geolocation){status.className='location-status err';status.textContent='Geolocation not supported.';return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      userLat=pos.coords.latitude; userLng=pos.coords.longitude;
      locationConfirmed=true;
      status.className='location-status ok';
      status.textContent='GPS locked';
      checkReady();
    },
    ()=>{status.className='location-status err';status.textContent='GPS failed — enter an intersection below.';}
  );
}

function checkReady(){
  document.getElementById('submitBtn').disabled = !(selectedCat && userLat !== null && userLng !== null);
}

function resetForm(){
  selectedCat=userLat=userLng=selectedPhotoFile=null;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));
  if(document.getElementById('street1Input')) document.getElementById('street1Input').value='';
  if(document.getElementById('street2Input')) document.getElementById('street2Input').value='';
  locationConfirmed=false;
  document.getElementById('descInput').value='';
  document.getElementById('locStatus').className='location-status';
  document.getElementById('locStatus').textContent='GPS or intersection required';
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('photoPreview').style.display='none';
  document.getElementById('photoPreview').src='';
  document.getElementById('photoDrop').classList.remove('has-file');
  document.getElementById('photoDropText').textContent='Tap to add a photo';
  document.getElementById('photoInput').value='';
  document.getElementById('photoStatus').textContent='';
}

async function geocodeAddress(address){
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address+', El Paso, TX')}&limit=1`);
    const data=await res.json();
    if(data&&data[0]) return {lat:parseFloat(data[0].lat),lng:parseFloat(data[0].lon)};
  }catch(e){ console.warn('Geocode failed:',e); }
  return null;
}

async function submitReport(){
  const desc=document.getElementById('descInput').value.trim()||'';
  const s1 = document.getElementById('street1Input') ? document.getElementById('street1Input').value.trim() : '';
  const s2 = document.getElementById('street2Input') ? document.getElementById('street2Input').value.trim() : '';
  const address = s1 && s2 ? s1+' & '+s2 : (s1 || s2);
  const btn=document.getElementById('submitBtn');
  const status=document.getElementById('photoStatus');

  // Validate before doing anything
  const errors = validateReport(selectedCat, desc, userLat, userLng);
  if(errors.length > 0){
    showToast(errors[0]);
    return;
  }

  btn.disabled=true;
  let photoUrl=null;
  const finalDesc = desc || 'No description provided.';

  // location already set via GPS or street selection

  if(selectedPhotoFile&&window._uploadPhoto){
    status.textContent='Uploading photo...';
    try{
      const uploadPromise=window._uploadPhoto(selectedPhotoFile);
      const timeoutPromise=new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),30000));
      photoUrl=await Promise.race([uploadPromise,timeoutPromise]);
      status.textContent='';
    }catch(e){
      status.textContent=e.message==='timeout'?'Photo timed out — submitting without it.':'Upload failed — submitting without photo.';
    }
  }else if(selectedPhotoFile&&!window._uploadPhoto){
    status.textContent='Storage not ready — submitting without photo.';
  }

  const report={lat:userLat||null,lng:userLng||null,cat:selectedCat,desc:finalDesc,address,photoUrl,timestamp:new Date()};

  if(window._addReport){
    try{
      await window._addReport(report);
      showToast('Report submitted — thank you.');
    }catch(e){
      showToast('Error saving. Please try again.');
      btn.disabled=false; btn.textContent='Submit Report';
      console.error(e); return;
    }
  }else{
    if(userLat){addReport(report);updateStats();}
    showToast('Demo mode — report saved locally');
  }

  closeModal();
  if(userLat) map.setView([userLat,userLng],15);
}


let autocompleteTimer = null;
let street1Selected = false, street2Selected = false;

function fetchSuggestions(query, num){
  clearTimeout(autocompleteTimer);
  autocompleteTimer = setTimeout(async ()=>{
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query+', El Paso, TX')}&limit=5&countrycodes=us`);
      const data = await res.json();
      showAutocomplete(data, num);
    }catch(e){ hideAutocomplete(num); }
  }, 300);
}

let _acResults = {};

function showAutocomplete(results, num){
  const list = document.getElementById('autocomplete-list-'+num);
  if(!results || results.length === 0){ hideAutocomplete(num); return; }
  _acResults[num] = results;
  list.innerHTML = results.map((r, i) => {
    const short = r.display_name.split(',')[0].trim();
    return `<div data-idx="${i}"
      style="padding:9px 12px;font-family:var(--mono);font-size:11px;color:var(--muted2);cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.06);"
      onmouseover="this.style.background='rgba(255,107,0,0.08)';this.style.color='var(--text)'"
      onmouseout="this.style.background='';this.style.color='var(--muted2)'"
    >${escHtml(short)}</div>`;
  }).join('');
  list.onclick = function(e){
    const item = e.target.closest('[data-idx]');
    if(!item) return;
    const r = _acResults[num][parseInt(item.dataset.idx)];
    const short = r.display_name.split(',')[0].trim();
    selectStreet(num, short, r.display_name, r.lat, r.lon);
  };
  list.style.display = 'block';
}

function hideAutocomplete(num){
  if(num){
    const el = document.getElementById('autocomplete-list-'+num);
    if(el) el.style.display = 'none';
  } else {
    [1,2].forEach(n=>{ const el=document.getElementById('autocomplete-list-'+n); if(el) el.style.display='none'; });
  }
}

function selectStreet(num, short, full, lat, lng){
  document.getElementById('street'+num+'Input').value = short;
  if(num===1){ street1Selected=true; window._street1={lat:parseFloat(lat),lng:parseFloat(lng),name:short}; }
  if(num===2){ street2Selected=true; window._street2={lat:parseFloat(lat),lng:parseFloat(lng),name:short}; }
  hideAutocomplete(num);
  // If both streets selected, average their coordinates as the intersection point
  if(street1Selected && street2Selected && window._street1 && window._street2){
    userLat = (window._street1.lat + window._street2.lat) / 2;
    userLng = (window._street1.lng + window._street2.lng) / 2;
    locationConfirmed = true;
    const status = document.getElementById('locStatus');
    status.className = 'location-status ok';
    status.textContent = window._street1.name + ' & ' + window._street2.name;
    checkReady();
  } else if(num===1 && street1Selected){
    // One street entered — use it directly but don't confirm yet
    userLat = window._street1.lat; userLng = window._street1.lng;
    locationConfirmed = true;
    const status = document.getElementById('locStatus');
    status.className = 'location-status ok';
    status.textContent = short + ' (add Street 2 for more accuracy)';
    checkReady();
  }
}

document.addEventListener('click', function(e){
  if(!e.target.closest('[id^="autocomplete-list"]') && !['street1Input','street2Input'].includes(e.target.id)){
    hideAutocomplete(1); hideAutocomplete(2);
  }
});


// ── BOUNDARIES ──
const BOUNDARIES = {
  el_paso_county: {
    name: 'El Paso County',
    // Bounding box: minLat, maxLat, minLng, maxLng
    box: [31.6, 32.1, -106.7, -105.95]
  },
  juarez: {
    name: 'Ciudad Juárez',
    box: [31.5, 31.8, -106.6, -106.3]
  }
};

function isInAllowedArea(lat, lng) {
  return Object.values(BOUNDARIES).some(region => {
    const [minLat, maxLat, minLng, maxLng] = region.box;
    return lat >= minLat && lat <= maxLat && lng >= minLng && lng <= maxLng;
  });
}

// ── CONTENT FILTER ──
const BANNED_WORDS = [
  'fuck','shit','ass','bitch','cunt','dick','cock','pussy','nigger','nigga',
  'faggot','retard','spic','wetback','chink','kike','bastard','whore','slut',
  'nazi','kkk','rape','kill yourself','kys'
];

function containsBannedContent(text) {
  if(!text) return false;
  const lower = text.toLowerCase().replace(/[^a-z0-9\s]/g,'');
  return BANNED_WORDS.some(word => lower.includes(word));
}

function isGibberish(text) {
  if(!text || text.length < 3) return false;
  // Flag if more than 60% is repeated characters or no vowels in 10+ char string
  const noSpaces = text.replace(/\s/g,'');
  if(noSpaces.length > 10) {
    const vowels = (noSpaces.match(/[aeiouAEIOU]/g)||[]).length;
    if(vowels / noSpaces.length < 0.05) return true;
  }
  // Flag keyboard mash patterns
  if(/^[asdfghjklqwertyuiopzxcvbnm]{8,}$/i.test(noSpaces) && !/[aeiou]{2}/i.test(noSpaces)) return true;
  return false;
}

function validateReport(cat, desc, lat, lng) {
  const errors = [];
  if(!cat) errors.push('Please select a category.');
  if(!lat || !lng) errors.push('Please provide a location.');
  if(lat && lng && !isInAllowedArea(lat, lng)) {
    errors.push('Location must be within El Paso County or Ciudad Juárez.');
  }
  if(desc && containsBannedContent(desc)) {
    errors.push('Description contains inappropriate content.');
  }
  if(desc && isGibberish(desc)) {
    errors.push('Please enter a real description.');
  }
  if(desc && desc.length > 500) {
    errors.push('Description must be under 500 characters.');
  }
  return errors;
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3500);
}
</script>

function compressImage(file,maxPx,quality){
  return new Promise(resolve=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let{width:w,height:h}=img;
      if(w>maxPx||h>maxPx){
        if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
        else{w=Math.round(w*maxPx/h);h=maxPx;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>resolve(blob||file),'image/jpeg',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve(file);};
    img.src=url;
  });
}
